name: preloaded_page_view
description: A PageView that builds the next and previous N pages ahead of time, so videos, images and feeds are ready before you swipe. Zero dependencies.
version: 0.1.0
homepage: https://github.com/ManukumarSB/preloaded_page_view
repository: https://github.com/ManukumarSB/preloaded_page_view
issue_tracker: https://github.com/ManukumarSB/preloaded_page_view/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
